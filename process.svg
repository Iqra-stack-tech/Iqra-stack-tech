<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Iqra's design-to-code process</title>
<desc id="desc">Four animated cards showing understand, design, build and refine.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0B1022"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-opacity=".045"/></pattern>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .dash{stroke-dasharray:8 12;animation:dash 2s linear infinite}.f1{animation:f1 4.8s ease-in-out infinite}.f2{animation:f2 5.4s ease-in-out infinite}.f3{animation:f1 5.1s ease-in-out infinite .6s}.f4{animation:f2 5.8s ease-in-out infinite .4s}.pulse{animation:pulse 2.5s ease-in-out infinite;transform-origin:center}
    @keyframes dash{to{stroke-dashoffset:-40}}@keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
  </style>
</defs>
<rect width="1200" height="310" rx="28" fill="url(#bg)"/>
<rect width="1200" height="310" rx="28" fill="url(#grid)"/>
<text x="54" y="46" fill="#64748B" font-size="11" font-weight="700" letter-spacing="2.2">ONE CONTINUOUS PRODUCT LOOP</text>
<path d="M160 154 C270 112 328 194 440 154 S610 114 720 154 S895 194 1040 154" fill="none" stroke="url(#flow)" stroke-width="3" stroke-opacity=".58" class="dash"/>
<circle r="7" fill="#F8FAFC" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M160 154 C270 112 328 194 440 154 S610 114 720 154 S895 194 1040 154"/></circle>

<g transform="translate(58 78)" class="f1" filter="url(#shadow)">
 <rect width="230" height="176" rx="24" fill="#0F172A" stroke="#334155"/>
 <circle cx="34" cy="34" r="18" fill="#0E7490" fill-opacity=".25" stroke="#22D3EE"/><text x="34" y="39" text-anchor="middle" fill="#A5F3FC" font-size="13" font-weight="800">01</text>
 <text x="26" y="86" fill="#F8FAFC" font-size="22" font-weight="800">Understand</text>
 <text x="26" y="116" fill="#94A3B8" font-size="13">Problem • audience • context</text>
 <path d="M27 143 h72" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"><animate attributeName="d" values="M27 143 h30;M27 143 h72;M27 143 h52;M27 143 h72" dur="5s" repeatCount="indefinite"/></path>
 <text x="26" y="165" fill="#64748B" font-size="10" letter-spacing="1.3">ASK BEFORE DRAWING</text>
</g>
<g transform="translate(345 78)" class="f2" filter="url(#shadow)">
 <rect width="230" height="176" rx="24" fill="#0F172A" stroke="#334155"/>
 <circle cx="34" cy="34" r="18" fill="#6D28D9" fill-opacity=".25" stroke="#A78BFA"/><text x="34" y="39" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="800">02</text>
 <text x="26" y="86" fill="#F8FAFC" font-size="22" font-weight="800">Design</text>
 <text x="26" y="116" fill="#94A3B8" font-size="13">Flow • wireframe • prototype</text>
 <rect x="26" y="137" width="72" height="8" rx="4" fill="#312E81"/><rect x="26" y="137" width="46" height="8" rx="4" fill="#A78BFA"><animate attributeName="width" values="18;62;46;62" dur="4.6s" repeatCount="indefinite"/></rect>
 <text x="26" y="165" fill="#64748B" font-size="10" letter-spacing="1.3">MAKE INTENT VISIBLE</text>
</g>
<g transform="translate(632 78)" class="f3" filter="url(#shadow)">
 <rect width="230" height="176" rx="24" fill="#0F172A" stroke="#334155"/>
 <circle cx="34" cy="34" r="18" fill="#0369A1" fill-opacity=".25" stroke="#38BDF8"/><text x="34" y="39" text-anchor="middle" fill="#BAE6FD" font-size="13" font-weight="800">03</text>
 <text x="26" y="86" fill="#F8FAFC" font-size="22" font-weight="800">Build</text>
 <text x="26" y="116" fill="#94A3B8" font-size="13">Flutter • layout • interaction</text>
 <text x="26" y="146" fill="#67E8F9" font-size="14" class="mono">&lt;Widget /&gt;</text><rect x="112" y="134" width="3" height="18" fill="#67E8F9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
 <text x="26" y="165" fill="#64748B" font-size="10" letter-spacing="1.3">TURN FLOW INTO BEHAVIOR</text>
</g>
<g transform="translate(919 78)" class="f4" filter="url(#shadow)">
 <rect width="230" height="176" rx="24" fill="#0F172A" stroke="#334155"/>
 <circle cx="34" cy="34" r="18" fill="#BE185D" fill-opacity=".22" stroke="#F472B6"/><text x="34" y="39" text-anchor="middle" fill="#FBCFE8" font-size="13" font-weight="800">04</text>
 <text x="26" y="86" fill="#F8FAFC" font-size="22" font-weight="800">Refine</text>
 <text x="26" y="116" fill="#94A3B8" font-size="13">Test • polish • simplify</text>
 <circle cx="42" cy="143" r="8" fill="#F472B6" fill-opacity=".28" class="pulse"/><circle cx="73" cy="143" r="8" fill="#A78BFA" fill-opacity=".28" class="pulse"/><circle cx="104" cy="143" r="8" fill="#22D3EE" fill-opacity=".28" class="pulse"/>
 <text x="26" y="165" fill="#64748B" font-size="10" letter-spacing="1.3">REMOVE EVERY ROUGH EDGE</text>
</g>
</svg>